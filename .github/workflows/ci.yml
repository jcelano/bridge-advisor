name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Install root dependencies (server)
      - name: Install server dependencies
        run: npm ci

      # Install frontend dependencies
      - name: Install frontend dependencies
        run: cd svelte-app && npm ci

      # Syntax check server files
      - name: Check server syntax
        run: |
          node -c server/index.js
          node -c server/auth.js
          node -c server/db.js
          node -c server/history.js

      # Svelte type checking
      - name: Svelte check
        run: cd svelte-app && npx svelte-check --threshold error

      # Run unit tests
      - name: Run tests
        run: cd svelte-app && npm test

      # Build frontend (catches import errors, missing files, etc.)
      - name: Build frontend
        run: cd svelte-app && npm run build

  security:
    name: Security Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Check for secrets in the PR diff
      - name: Check for secrets in code
        run: |
          # Fail if .env is being added/modified in this PR
          if git diff --name-only origin/main...HEAD | grep -q '^\.env$'; then
            echo "::error::.env file was modified in this PR — make sure no secrets are committed!"
            exit 1
          fi
          # Check for common secret patterns in tracked files
          if grep -rn --include='*.js' --include='*.svelte' --include='*.json' \
            -E '(sk-ant-api|sk_live_|sk_test_|re_[A-Za-z0-9]{20,}|whsec_)' \
            --exclude-dir=node_modules --exclude-dir=.svelte-kit .; then
            echo "::error::Possible secrets found in source code!"
            exit 1
          fi
          echo "No secrets detected"
