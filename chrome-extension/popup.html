<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bridge Advisor Connector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: #111d11;
      color: #b0d0b0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a3a1a, #0e220e);
      border-bottom: 1px solid #2a4a2a;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 22px; line-height: 1; }
    .header-title { font-size: 14px; font-weight: 700; color: #c0e8c0; }
    .header-sub   { font-size: 11px; color: #6a9a6a; margin-top: 1px; }

    /* ── Status section ── */
    .status {
      padding: 14px 16px;
      border-bottom: 1px solid #1e321e;
    }
    .status-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #5a8a5a;
      margin-bottom: 8px;
    }
    .status-none {
      color: #5a7a5a;
      font-size: 12px;
      line-height: 1.5;
    }
    .status-captured {
      background: #0e1e0e;
      border: 1px solid #2a4a2a;
      border-radius: 7px;
      padding: 8px 10px;
    }
    .status-time {
      color: #5a9a5a;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .pbn-preview {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 10px;
      color: #7ab07a;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 72px;
      overflow: hidden;
      position: relative;
    }
    .pbn-preview::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 24px;
      background: linear-gradient(transparent, #0e1e0e);
    }

    /* ── Buttons ── */
    .actions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary {
      background: linear-gradient(135deg, #2d5a2d, #1a3a1a);
      border: 1.5px solid #4a8a4a;
      color: #c0e8c0;
    }
    .btn-primary:not(:disabled):hover { background: linear-gradient(135deg, #3a6a3a, #2a4a2a); }
    .btn-secondary {
      background: #1a2e1a;
      border: 1px solid #2a4a2a;
      color: #7ab07a;
      font-weight: 500;
    }
    .btn-secondary:not(:disabled):hover { background: #1e361e; }

    /* ── Settings ── */
    .settings {
      padding: 12px 16px 16px;
      border-top: 1px solid #1e321e;
    }
    .settings-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #5a8a5a;
      margin-bottom: 8px;
    }
    .settings-row {
      display: flex;
      gap: 6px;
    }
    .settings-input {
      flex: 1;
      background: #0e1e0e;
      border: 1px solid #2a4a2a;
      border-radius: 6px;
      padding: 7px 9px;
      color: #a0c8a0;
      font-size: 12px;
      font-family: "SF Mono", "Fira Code", monospace;
      outline: none;
    }
    .settings-input:focus { border-color: #4a8a4a; }
    .btn-save {
      background: #1e3a1e;
      border: 1px solid #3a6a3a;
      border-radius: 6px;
      padding: 7px 12px;
      color: #7ab07a;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-save:hover { background: #2a4a2a; }
    .saved-msg {
      font-size: 11px;
      color: #5a9a5a;
      margin-top: 6px;
      height: 14px;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">♠</div>
    <div>
      <div class="header-title">Bridge Advisor Connector</div>
      <div class="header-sub">Trickster Cards → Bridge Advisor</div>
    </div>
  </div>

  <div class="status">
    <div class="status-label">Last captured hand</div>
    <div id="status-none" class="status-none">
      No hand captured yet.<br>
      Finish a hand on Trickster Cards — you'll be prompted to analyze it automatically.
    </div>
    <div id="status-captured" class="status-captured" style="display:none">
      <div id="captured-time" class="status-time"></div>
      <div id="pbn-preview" class="pbn-preview"></div>
    </div>
  </div>

  <div class="actions">
    <button id="btn-open" class="btn btn-primary" disabled>
      Open in Bridge Advisor →
    </button>
    <button id="btn-copy" class="btn btn-secondary" disabled>
      Copy PBN to clipboard
    </button>
  </div>

  <div class="settings">
    <div class="settings-label">Bridge Advisor URL</div>
    <div class="settings-row">
      <input
        id="advisor-url"
        class="settings-input"
        type="text"
        placeholder="http://localhost:5174"
        spellcheck="false"
      />
      <button id="btn-save" class="btn-save">Save</button>
    </div>
    <div id="saved-msg" class="saved-msg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
