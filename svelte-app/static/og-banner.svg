<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0c1219"/>

  <!-- Subtle felt texture lines -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#felt)" opacity="0.04"/>
  <defs>
    <pattern id="felt" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff"/>
    </pattern>
  </defs>

  <!-- Gold accent bar at top -->
  <rect x="0" y="0" width="1200" height="6" fill="#d4af37"/>
  <!-- Gold accent bar at bottom -->
  <rect x="0" y="624" width="1200" height="6" fill="#d4af37"/>

  <!-- Large spade icon, left side -->
  <!-- Left lobe -->
  <circle cx="238" cy="295" r="122" fill="#d4af37"/>
  <!-- Right lobe -->
  <circle cx="402" cy="295" r="122" fill="#d4af37"/>
  <!-- Top point -->
  <polygon points="320,118 412,280 228,280" fill="#d4af37"/>
  <!-- Stem -->
  <path d="M282,400 Q320,490 258,528 L382,528 Q320,490 358,400 Z" fill="#d4af37"/>

  <!-- App name -->
  <text x="560" y="260" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#d4af37">The Stayman</text>
  <text x="560" y="348" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#d4af37">Whisperer</text>

  <!-- Tagline -->
  <text x="560" y="420" font-family="Georgia, serif" font-size="32" fill="#6a9a6a">Your AI bridge partner</text>

  <!-- Suit symbols decorative -->
  <text x="60" y="126" font-family="serif" font-size="64" fill="#d4af37" opacity="0.15">♠</text>
  <text x="1060" y="580" font-family="serif" font-size="64" fill="#d4af37" opacity="0.15">♠</text>
  <text x="1080" y="126" font-family="serif" font-size="48" fill="#e74c3c" opacity="0.15">♥</text>
  <text x="60" y="590" font-family="serif" font-size="48" fill="#e74c3c" opacity="0.15">♥</text>
</svg>
