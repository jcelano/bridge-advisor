<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- Primary meta -->
    <meta name="description" content="AI-powered bridge analysis and coaching. Get expert advice on bidding, leads, and declarer play." />

    <!-- Open Graph (link previews in Slack, iMessage, Twitter, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Stayman Whisperer" />
    <meta property="og:description" content="Your AI bridge partner. Get expert analysis of bidding, opening leads, and declarer play." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Stayman Whisperer" />
    <meta name="twitter:description" content="Your AI bridge partner. Get expert analysis of bidding, opening leads, and declarer play." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Cloudflare Turnstile (bot protection) -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
